name: Daily Telegram A4 Summary (รายงานสรุปยอด A4 ประจำวัน 20:00 น.)

on:
  schedule:
    # 13:00 UTC = 20:00 Bangkok Time (UTC+7) every day
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run ignoring stop conditions (true/false)'
        required: false
        default: 'false'

jobs:
  daily-a4-report:
    name: Generate & Send 4 A4 Pages to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Verify Google Chrome on Runner
        run: |
          which google-chrome || true
          google-chrome --version || true

      - name: Run Daily A4 Telegram Reporter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hsswobqnjzwqsczbxmrj.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_fr8rj2iLrQhkl3Yjg7qGPg_O4FnnIYG' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '7577840608:AAH_m0LWjRk3916GSvBcTsp1YLdaJXFlIy0' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5413358910' }}
          APP_URL: 'https://triple-t-form.vercel.app'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome'
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          node scripts/telegram-daily-a4-summary.mjs
